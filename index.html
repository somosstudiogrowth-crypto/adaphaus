<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mesa de revisión</title>
<style>
  :root{
    --canvas:#F6F6F8; --sidebar:#191A20; --sidebarLine:#2B2D36; --sidebarText:#E7E7EB; --sidebarMuted:#9496A3;
    --panel:#FFFFFF; --ink:#18181B; --inkSoft:#5B5B63; --inkFaint:#94949C; --line:#E4E4E9;
    --accent:#A3E635; --accentDark:#5C8A0F; --accentSoft:#F1FBD4; --accentText:#1A2E05;
    --danger:#C0392B; --viewerBg:#202124; --viewerLine:#3C4043;
    --st-sin:#9496A3; --st-req:#F0730A; --st-proc:#38BDF8; --st-real:#FACC15; --st-val:#22C55E; --st-rev:#EC4899;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
  button,input,textarea{font-family:inherit;}
  .hidden{display:none !important;}
  a{color:inherit;}

  /* ---- setup / config screens ---- */
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar);padding:24px;}
  .card-box{width:400px;max-width:100%;background:#fff;border-radius:12px;padding:32px;box-sizing:border-box;}
  .card-box h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .card-box p.sub{color:var(--inkSoft);font-size:13.5px;margin:0 0 22px;}
  .field label{display:block;font-size:12.5px;color:var(--inkSoft);margin-bottom:4px;font-weight:600;}
  .field input, .field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:14px;}
  .role-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .role-toggle button{flex:1;padding:9px 0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);}
  .role-toggle button.active{border-color:var(--accentDark);background:var(--accent);color:var(--accentText);}
  .btn-primary{width:100%;padding:11px 0;background:var(--accent);color:var(--accentText);border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .err-text{color:var(--danger);font-size:12.5px;margin-bottom:12px;}
  code.inline{background:#EEE;padding:1px 5px;border-radius:4px;font-size:12.5px;}

  /* ---- app shell ---- */
  #app-root{min-height:100vh;}
  .topbar{background:var(--sidebar);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .topbar .brand{font-size:17px;font-weight:800;letter-spacing:-0.01em;}
  .topbar .sub{font-size:12px;color:var(--sidebarMuted);}
  .user-chip{display:flex;align-items:center;gap:8px;background:#22232B;border-radius:10px;padding:6px 10px 6px 6px;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accentSoft);color:var(--accentDark);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;}
  .user-chip .name{font-weight:700;font-size:12.5px;}
  .user-chip .meta{color:var(--sidebarMuted);font-size:11.5px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--sidebarMuted);font-size:15px;display:flex;align-items:center;padding:2px;}

  .month-bar{background:var(--sidebar);padding:12px 16px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--sidebarLine);}
  .month-tab-wrap{display:inline-flex;border-radius:10px 10px 0 0;overflow:hidden;}
  .month-bar .month-tab{padding:7px 14px;border-radius:0;font-size:12.5px;font-weight:700;cursor:pointer;border:none;background:#22232B;color:var(--sidebarMuted);}
  .month-bar .month-tab.active{background:var(--canvas);color:var(--ink);}
  .month-bar .month-del{padding:0 9px;border:none;background:#2B2C35;color:var(--sidebarMuted);cursor:pointer;font-size:11px;}
  .month-bar .month-del:hover{background:#3A3B45;color:#fff;}
  .month-bar .new-month-btn{padding:7px 12px;border-radius:10px 10px 0 0;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px dashed #444650;background:none;color:var(--sidebarMuted);margin-left:auto;}
  .view-tabs{background:var(--canvas);padding:14px 20px 0;display:flex;gap:6px;border-bottom:1px solid var(--line);max-width:1180px;margin:0 auto;}
  .view-tabs button{padding:9px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--inkFaint);}
  .view-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 -2px 0 var(--accentDark) inset;}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
  .dash-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
  .dash-card .num{font-size:26px;font-weight:800;}
  .dash-card .lbl{font-size:12px;color:var(--inkSoft);margin-top:2px;}
  .dash-progress{height:10px;border-radius:20px;background:var(--line);overflow:hidden;margin-bottom:6px;}
  .dash-progress .fill{height:100%;background:var(--st-val);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-head{font-size:11.5px;font-weight:700;color:var(--inkFaint);text-align:center;padding-bottom:4px;}
  .cal-cell{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;}
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell .daynum{font-size:11px;color:var(--inkFaint);margin-bottom:4px;}
